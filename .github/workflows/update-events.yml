name: Update Her Match Events

on:
  workflow_dispatch:

  schedule:
    # 11:17 UTC is 7:17 a.m. Toronto during daylight time.
    # An off-hour minute can reduce peak-time scheduling delays.
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore private calendar sources
        env:
          SOURCES_CSV_BASE64: ${{ secrets.SOURCES_CSV_BASE64 }}
        run: |
          if [ -z "$SOURCES_CSV_BASE64" ]; then
            echo "Missing required SOURCES_CSV_BASE64 repository secret."
            exit 1
          fi

          printf '%s' "$SOURCES_CSV_BASE64" | base64 --decode > data/sources.csv

      - name: Collect events and create newsletter draft
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          SPORT: ${{ vars.SPORT }}
          COMPETITION: ${{ vars.COMPETITION }}
          DISPLAY_TIMEZONE: America/Toronto
          DAYS_AHEAD: "14"
        run: python main.py

      - name: Generate website event data
        run: python website/build_events.py

      - name: Commit updated data
        run: |
          git config --global user.name "Her Match Automation"
          git config --global user.email "actions@users.noreply.github.com"

          echo "Checking generated files..."
          ls -la data || true
          ls -la output || true

          git add -f data/events.csv
          git add -f data/changes.csv
          git add -f output/newsletter.md
          git add -f website/events.js

          if git diff --cached --quiet; then
            echo "No event changes to commit."
            exit 0
          fi

          git commit -m "Update Her Match events"
          git push origin HEAD:main
